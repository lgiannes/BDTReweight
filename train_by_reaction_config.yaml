# Default configuration for train_by_reaction_config.py
#
# This file reproduces the exact behaviour that used to be hard-coded in
# train_by_reaction.py: same categories, same reaction-frame variables,
# same processes (QE, 2p2h, Oth), same diagnostic binning, and the same
# output file naming scheme.

# Per-nucleon basis of the total cross sections. NUISANCE reports the target
# xsec per total nucleon (incl. hydrogen for a composite target), the source per
# A_source nucleon. The target xsec is rescaled by A_target/A_source so the
# total-xsec ratio s is on a consistent per-nucleon basis. Leave both equal for a
# pure-carbon target (no correction); use A_source=12, A_target=13 for a carbon
# source vs a polystyrene (CH) target.
A_source: 1.0
A_target: 1.0

# Maps the integer 'topology' branch stored in the source ROOT file to a
# category name. This is a property of how the source ntuple was produced,
# not a free choice, so it must stay in sync with the source file.
topology_codes:
  0: 0p0n
  1: 0pNn
  2: 1p0n
  3: 1pNn
  4: 2p0n
  5: 2pNn
  6: others

# Kinetic energy thresholds (GeV) used when counting final-state particles
# to determine event topology. Use a very large threshold to effectively
# ignore a species when building topologies.
ke_thresholds:
  proton: 50000
  neutron: 50000

# Per-category configuration.
#   particle_counts:    final-state particle counting rules (passed to
#                        NuisanceFlatTree.get_mask_topology), python
#                        comparison syntax.
#   variable_exprs:      event-level variable expressions to pull out of
#                        the NUISANCE flat tree.
#   reweight_variables:  variables the BDT is trained on.
#   particle_names:      particles whose momenta get rotated into the
#                        reaction frame.
#   drawing_variables:   variables plotted in the diagnostic figures.
categories:
  0p0n:
    particle_counts: {muon: "==1", proton: "==0", neutron: "==0"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables: [total_proton_KE, leading_muon_py, psi_prime]
    particle_names: [total_proton]
    drawing_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, psi_prime, weight]

  0pNn:
    particle_counts: {muon: "==1", proton: "==0", neutron: ">=1"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - leading_neutron_px
      - leading_neutron_py
      - leading_neutron_pz
      - leading_neutron_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables:
      - leading_neutron_px
      - leading_neutron_py
      - leading_neutron_pz
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
      - leading_muon_py
      - leading_muon_pz
      - psi_prime
    particle_names: [leading_neutron, total_proton]
    drawing_variables:
      - leading_neutron_px
      - leading_neutron_py
      - leading_neutron_pz
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
      - leading_muon_py
      - leading_muon_pz
      - weight

  1p0n:
    particle_counts: {muon: "==1", proton: "==1", neutron: "==0"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, psi_prime]
    particle_names: [total_proton]
    drawing_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, weight]

  1pNn:
    particle_counts: {muon: "==1", proton: "==1", neutron: ">=1"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, psi_prime]
    particle_names: [total_proton]
    drawing_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, weight]

  2p0n:
    particle_counts: {muon: "==1", proton: "==2", neutron: "==0"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, psi_prime]
    particle_names: [total_proton]
    drawing_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, weight]

  2pNn:
    particle_counts: {muon: "==1", proton: "==2", neutron: ">=1"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables: [total_proton_KE, leading_muon_py, leading_muon_pz]
    particle_names: [total_proton]
    drawing_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, weight]

  others:
    particle_counts: {muon: "==1", proton: ">=2", neutron: ">=1"}
    variable_exprs:
      - Enu_true
      - Q2
      - q0
      - q3
      - W
      - leading_muon_px
      - leading_muon_py
      - leading_muon_pz
      - leading_muon_KE
      - total_proton_px
      - total_proton_py
      - total_proton_pz
      - total_proton_KE
    reweight_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, psi_prime]
    particle_names: [total_proton]
    drawing_variables: [total_proton_KE, leading_muon_py, leading_muon_pz, weight]

# Processes to reweight independently, in the order they are trained.
# reaction_code_rule is applied to the source sample's 'reactionCode'
# column, mode_rule to the target sample's NUISANCE 'Mode' branch
# (NuisanceFlatTree.get_mode()). Both use python comparison syntax
# and are evaluated against the corresponding array (e.g. ">2", "==1").
processes:
  - name: Oth
    reaction_code_rule: ">2"
    mode_rule: ">2"
  - name: "2p2h"
    reaction_code_rule: "==2"
    mode_rule: "==2"
  - name: QE
    reaction_code_rule: "==1"
    mode_rule: "==1"

# Bin edges used for the diagnostic plots (muon pT and recoil slices of
# psi_prime, and the psi_prime histograms themselves).
binning:
  muon_pt_gev:
    - 0.0
    - 0.075
    - 0.15
    - 0.25
    - 0.325
    - 0.4
    - 0.475
    - 0.55
    - 0.7
    - 0.85
    - 1.0
    - 1.25
    - 1.75
    - 2.5
  recoil_mev:
    - 0.0
    - 20.0
    - 40.0
    - 80.0
    - 120.0
    - 160.0
    - 240.0
    - 320.0
    - 400.0
    - 600.0
    - 800.0
    - 1400.0
  psi_prime:
    - -10.0
    - -5.0
    - -4.0
    - -3.0
    - -2.5
    - -2.0
    - -1.5
    - -1.0
    - -0.75
    - -0.5
    - -0.25
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
    - 3.0
    - 5.0
    - 10.0

# Output naming. Templates are formatted with {playlist}, {model}, and
# {category} (model_pickle_template only gets {category}, since it is
# already saved under a <model>/<process>/ directory).
output:
  weight_tree_filename_template: "ReweightWeights_{playlist}_{model}_{category}.root"
  weight_tree_name: "reweight_tree"
  model_pickle_template: "GBReweighterModel_{category}.pkl"
